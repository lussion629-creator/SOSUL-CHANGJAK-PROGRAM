name: 데스크톱 앱 만들기

# 새 버전 내기: package.json의 version을 올려 main에 올리면(또는 이 작업을 직접 실행하면)
# Windows·macOS 설치 파일을 만들어 GitHub 릴리스 v<버전>에 붙인다.
# 설치된 앱은 이 릴리스를 보고 스스로 업데이트한다 (Windows: 자동 설치, macOS: 새 버전 알림).
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 비밀 값 점검 (키·토큰이 저장소에 없는지)
        run: npm run check:secrets
      - run: npx vite build
      - run: npx electron-builder --publish never ${{ matrix.os == 'windows-latest' && '--win' || '--mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스에 올리기 (이미 있으면 파일만 바꾸기)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la out
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
          else
            gh release create "$V" out/* --target "$GITHUB_SHA" --title "소설 워드프로세서 ${V#v}" --notes-file .github/release-notes.md
          fi
