<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소설 워드프로세서</title>
<meta name="description" content="소설가를 위한 워드프로세서 — 자동 저장, 버전 기록, 퇴고 비교, 동기화 서버·구글 드라이브 동기화">
<meta name="theme-color" content="#efebe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<script>
  // 첫 화면 깜빡임 없이 테마 적용
  try { const t = localStorage.getItem('nw-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <!-- 상단 바 -->
  <header class="topbar">
    <button class="icon-btn" id="btnSidebar" title="왼쪽 목록 접기/펴기 (Ctrl+\\)" aria-label="왼쪽 목록 접기/펴기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="file">파일</button>
      <div class="menu" id="menu-file">
        <button data-act="home">작품 목록</button>
        <button data-act="newProject">새 작품</button>
        <hr>
        <button data-act="open">파일 열기… <small>Word · 한글 · PDF · 텍스트</small></button>
        <button data-act="importChapter">현재 작품에 장으로 넣기…</button>
        <hr>
        <button data-act="pageSetup">쪽 설정·템플릿… <small data-kbd="pageSetup">F7</small></button>
        <button data-act="export">내보내기… <small>docx · doc · hwpx · PDF</small></button>
        <button data-act="print">인쇄 / PDF로 저장</button>
        <hr>
        <button data-act="backup">작품 백업 파일 받기 (.novel.json)</button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="view">보기</button>
      <div class="menu" id="menu-view">
        <button data-act="pageView">쪽 보기 켜기/끄기 <small>용지 모양대로 한 쪽씩</small></button>
        <button data-act="focus">집중 모드</button>
        <button data-act="book">장 이어서 전체 보기 <small>모든 장을 한 번에</small></button>
        <button data-act="bookPlain">장 없이 전체 보기 <small>장 제목 없이 한 번에</small></button>
        <button data-act="cork">코르크보드 (장 카드)</button>
        <button data-act="annoSide">주석 여백 위치 <small>오른쪽·왼쪽·숨김</small></button>
        <button data-act="annoSticky">주석 포스트잇 켜기/끄기 <small data-kbd="annoSticky" data-kbd-prefix="원고 옆 쪽지">원고 옆 쪽지, Ctrl+Alt+P</small></button>
        <hr>
        <button data-act="colors">화면 색… <small>라이트 · 다크 · RGB로 내 색</small></button>
        <button data-act="synonyms">유의어 창 <small data-kbd="synonyms"></small></button>
        <button data-act="complement">보색 글자·형광펜 켜기/끄기 <small>바탕에서 가장 잘 보이는 색</small></button>
        <button data-act="theme">다크 모드 전환</button>
        <button data-act="settings">글꼴·화면 설정</button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="format">서식</button>
      <div class="menu" id="menu-format">
        <button data-act="fontDlg">글꼴… <small data-kbd="fontDlg">Ctrl+D</small></button>
        <button data-act="paraDlg">단락… <small data-kbd="paraDlg">Ctrl+Shift+P</small></button>
        <hr>
        <button data-act="bigger">글자 0.5pt 크게 <small data-kbd="bigger">Ctrl+]</small></button>
        <button data-act="smaller">글자 0.5pt 작게 <small data-kbd="smaller">Ctrl+[</small></button>
        <button data-act="lsWide">자간 1% 넓게 <small data-kbd="lsWide">Alt+Shift+W</small></button>
        <button data-act="lsNarrow">자간 1% 좁게 <small data-kbd="lsNarrow">Alt+Shift+N</small></button>
        <button data-act="lsReset">자간 기본으로</button>
        <hr>
        <button data-act="pageSetup">쪽 설정·템플릿… <small data-kbd="pageSetup">F7</small></button>
        <p class="menu-hint">원고에서 마우스 오른쪽 단추를 눌러도 글꼴·단락을 바꿀 수 있어요.</p>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="edit">퇴고</button>
      <div class="menu" id="menu-edit">
        <p class="menu-cap">찾기·고치기</p>
        <button data-act="find">찾기 / 바꾸기 <small data-kbd="find">Ctrl+F</small></button>
        <button data-act="proof">맞춤법·문장부호 교정 모드 켜기/끄기 <small data-kbd="proof" data-kbd-prefix="밑줄·왼쪽 여백 카드">밑줄·왼쪽 여백 카드, Ctrl+Alt+K</small></button>
        <button data-act="proofList">교정 목록·AI 맞춤법 검사 <small>자동·수동 고침, 틀린 곳 모아 고치기</small></button>
        <button data-act="tidy">원고 다듬기 <small>문장부호·띄어쓰기 정리</small></button>
        <button data-act="tidyMark">원고 다듬기 표시 켜기/끄기 <small>고치지 않고 표시만</small></button>
        <button data-act="analyze">퇴고 도우미 <small>반복어·긴 문장</small></button>
        <button data-act="revision">퇴고 모드 <small>이전 버전과 나란히 비교</small></button>
        <hr>
        <p class="menu-cap">주석·자료</p>
        <button data-act="annotate">주석 달기 <small data-kbd="annotate" data-kbd-prefix="색인·교정 제안·인용·의도">색인·교정 제안·인용·의도, Ctrl+Alt+M</small></button>
        <button data-act="annoSticky">주석 포스트잇 켜기/끄기 <small>원고 옆 쪽지</small></button>
        <button data-act="index">찾아보기 <small>색인 목록</small></button>
        <button data-act="appear">인물 등장 지도 <small>장마다 몇 번 나오나</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="read">낭독</button>
      <div class="menu" id="menu-read">
        <button data-act="readAloud">AI로 읽어 주기 <small data-kbd="readAloud" data-kbd-prefix="커서·고른 부분부터">커서·고른 부분부터, Ctrl+Alt+R</small></button>
        <button data-act="readChapter">이 장 처음부터 읽어 주기</button>
        <button data-act="speak">이 문단만 기기 목소리로 <small>Esc로 멈춤</small></button>
        <hr>
        <button data-act="readExport">음성 파일로 저장 <small>WAV · 장·작품 전체</small></button>
        <button data-act="readCast">등장인물 목소리 <small>인물마다 다른 목소리 · AI 판정</small></button>
        <button data-act="readSettings">낭독 설정 <small>Gemini 키·목소리·빠르기</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="log">기록</button>
      <div class="menu" id="menu-log">
        <p class="menu-cap">쓴 양·목표</p>
        <button data-act="today">오늘 쓴 양 <small>붙여넣기 따로·초기화</small></button>
        <button data-act="clips">복사·붙여넣기 기록 <small>무엇을 언제 붙여넣었나</small></button>
        <button data-act="stats">날짜별 기록 그래프 <small>쓴·고친·지운 양</small></button>
        <button data-act="goals">목표</button>
        <button data-act="sprint">타이머 <small>글쓰기 스프린트</small></button>
        <hr>
        <p class="menu-cap">버전·복구</p>
        <button data-act="snapshot">지금 버전 저장 <small>이름 붙이기</small></button>
        <button data-act="recover">실수 되돌리기 · 복구 <small>휴지통</small></button>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="tools">설정</button>
      <div class="menu" id="menu-tools">
        <button data-act="settings">글꼴·화면 설정</button>
        <button data-act="keys">단축키 설정</button>
        <button data-act="aiSettings">AI 글 모델 <small>대사 판정·AI 맞춤법 검사 · Gemini·GPT·Claude</small></button>
        <button data-act="readSettings">낭독 설정 <small>Gemini 키·목소리</small></button>
        <hr>
        <button data-act="storage">저장 방식 <small>오프라인 · 개인 서버 · 구글 드라이브</small></button>
        <button data-act="server">개인 서버 연결</button>
        <button data-act="drive">구글 드라이브 연결</button>
        <button data-act="help">도움말 <small data-kbd="help"></small></button>
        <button data-act="checkUpdate" id="mUpdate" hidden>업데이트 확인 <small id="mVersion"></small></button>
      </div>
    </div>
    <div class="doc-title">
      <div class="menu-wrap">
        <button class="menu-btn proj-btn" data-menu="projects" title="다른 작품·글로 바꾸기" aria-label="작품 바꾸기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v14"/><path d="M9 19V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v12"/><path d="m14.5 7.3 2.9-.8a1 1 0 0 1 1.2.7l3 11.3"/><path d="M3 19h18"/></svg><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu proj-menu" id="menu-projects"></div>
      </div>
      <input id="projectTitle" spellcheck="false" aria-label="작품 제목" placeholder="작품 제목" title="눌러서 작품 제목 바꾸기">
      <span class="sep">/</span>
      <input id="chapterTitle" spellcheck="false" aria-label="장 제목">
    </div>
    <div class="top-right">
      <span id="saveState" class="pill" title="손을 멈추고 5초 뒤 자동 저장">저장됨</span>
      <button id="syncState" class="pill" data-act="sync" title="동기화">☁ 동기화 꺼짐</button>
      <button class="icon-btn" id="btnPageView" data-act="pageView" title="쪽 보기 (용지 모양대로)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="11" height="14" rx="1"/><path d="M8 21h10a1 1 0 0 0 1-1V7"/><path d="M7 7h5M7 10h5M7 13h3"/></svg></button>
      <button class="icon-btn" data-act="revision" title="퇴고 모드 (나란히 비교)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M6 9h3M6 13h3M15 9h3M15 13h3"/></svg></button>
      <button class="icon-btn" data-act="focus" title="집중 모드"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="icon-btn" data-act="theme" title="다크 모드"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="icon-btn" id="btnHelp" data-act="help" data-kbd-title="help" title="도움말 (F1)" aria-expanded="false" aria-controls="helpPanel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8"/><path d="M12 17.2h.01"/></svg></button>
    </div>
  </header>

  <!-- 서식 도구 -->
  <div class="toolbar" id="toolbar">
    <button data-cmd="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button data-cmd="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="tsep"></span>
    <select id="blockType" title="문단 스타일">
      <option value="p">본문</option>
      <option value="h1">제목 1</option>
      <option value="h2">제목 2</option>
      <option value="h3">제목 3</option>
      <option value="quote">인용</option>
    </select>
    <select id="fontFamily" title="글꼴">
      <option value="">기본 글꼴</option>
      <option value="'Gowun Batang'">고운바탕</option>
      <option value="'Nanum Myeongjo'">나눔명조</option>
      <option value="'Noto Serif KR'">본명조</option>
      <option value="'KoPub Batang Light'">KoPub바탕 Light</option>
      <option value="'Nanum Gothic'">나눔고딕</option>
      <option value="Pretendard">프리텐다드</option>
      <option value="Batang, serif">바탕 (설치된 글꼴)</option>
    </select>
    <span class="size-box" title="글자 크기 (pt, 0.5 단위). Ctrl+[ 작게, Ctrl+] 크게">
      <button type="button" data-size="-0.5" aria-label="글자 0.5pt 작게">−</button>
      <input id="fontSize" list="fontSizes" inputmode="decimal" placeholder="크기" aria-label="글자 크기 (pt)" autocomplete="off">
      <button type="button" data-size="0.5" aria-label="글자 0.5pt 크게">+</button>
    </span>
    <span class="size-box ls-box" title="자간 (%). 글자를 고르지 않으면 커서가 있는 문단 전체에 적용. Alt+Shift+N 좁게, Alt+Shift+W 넓게">
      <span class="ls-label" aria-hidden="true">자간</span>
      <button type="button" data-ls="-1" aria-label="자간 1% 좁게">−</button>
      <input id="letterSpacing" placeholder="0" aria-label="자간 (% 또는 pt)" autocomplete="off">
      <button type="button" data-ls="1" aria-label="자간 1% 넓게">+</button>
    </span>
    <datalist id="fontSizes"><option value="7"><option value="7.5"><option value="8"><option value="8.5"><option value="9"><option value="9.5"><option value="10"><option value="10.5"><option value="11"><option value="11.5"><option value="12"><option value="12.5"><option value="13"><option value="13.5"><option value="14"><option value="15"><option value="16"><option value="18"><option value="20"><option value="22"><option value="24"><option value="28"><option value="32"><option value="36"></datalist>
    <span class="tsep"></span>
    <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
    <button data-cmd="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
    <button data-cmd="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
    <button data-cmd="strike" title="취소선"><s>가</s></button>
    <span class="hl-wrap"><button type="button" id="tcBtn" class="tc-btn" title="글자 색 (마지막에 고른 색)" aria-label="글자 색"><span>가</span></button><button type="button" class="hl-more" id="tcMore" title="글자 색 고르기" aria-label="글자 색 고르기" aria-haspopup="true">▾</button><div class="menu hl-pop tc-pop" id="tcPop" role="menu"></div></span>
    <span class="hl-wrap"><button data-cmd="highlight" title="형광펜 (마지막에 고른 색)" id="hlBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 6-6 4 4-6 6"/><path d="M9 11 6 18h5l2-3"/><path d="M4 21h16"/></svg></button><button type="button" class="hl-more" id="hlMore" title="형광펜 색 고르기" aria-label="형광펜 색 고르기" aria-haspopup="true">▾</button><div class="menu hl-pop" id="hlPop" role="menu"></div></span>
    <span class="tsep"></span>
    <button data-cmd="left" title="왼쪽 정렬"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
    <button data-cmd="center" title="가운데 정렬"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button data-cmd="right" title="오른쪽 정렬"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
    <button data-cmd="justify" title="양쪽 정렬"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
    <span class="tsep"></span>
    <button data-cmd="bullet" title="글머리 목록"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/><path d="M9 7h11M9 12h11M9 17h11"/></svg></button>
    <button data-cmd="ordered" title="번호 목록"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 7h10M10 12h10M10 17h10M4 5h1v4M4 9h2M4 15h2l-2 3h2"/></svg></button>
    <button data-cmd="scene" title="장면 전환 (* * *)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5.5 8.5l13 7M18.5 8.5l-13 7"/></svg></button>
    <button data-cmd="clear" title="서식 지우기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11l-3 13M9 4h9M3 20 21 4"/></svg></button>
    <span class="tsep"></span>
    <button data-act="find" title="찾기 / 바꾸기 (Ctrl+F)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></button>
    <button data-act="annotate" title="주석 달기: 색인·교정 제안·인용·의도 (Ctrl+Alt+M)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 14h4"/></svg></button>
    <button data-act="snapshot" title="지금 버전 저장 (이름 붙이기)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  </div>

  <div class="main">
    <!-- 왼쪽: 원고·자료·기록 -->
    <aside class="sidebar" id="sidebar">
      <nav class="tabs">
        <button data-tab="binder" class="on">원고</button>
        <button data-tab="notes">자료</button>
        <button data-tab="history">기록</button>
      </nav>
      <section class="tab" id="tab-binder">
        <div class="tab-head">
          <span id="projectCount"></span>
          <button class="small" data-act="addChapter">+ 장 추가</button>
        </div>
        <ol id="chapterList" class="chapter-list"></ol>
        <div class="tab-foot">
          <label>이 장 줄거리</label>
          <textarea id="chapterSynopsis" rows="3" placeholder="이 장에서 일어나는 일 (코르크보드 카드에 표시)"></textarea>
          <div class="row2 ch-meta">
            <label class="field"><span>상태</span><select id="chapterStatus">
            <option value="idea">구상</option>
            <option value="draft">초고</option>
            <option value="revise">퇴고 중</option>
            <option value="done">완료</option>
          </select></label>
            <label class="field"><span>목표 분량 (자)</span><input id="chapterGoal" type="number" min="0" step="500" placeholder="없음"></label>
          </div>
        </div>
      </section>
      <section class="tab" id="tab-notes" hidden>
        <div class="tab-head">
          <select id="noteFilter">
            <option value="all">전체</option>
            <option value="character">인물</option>
            <option value="place">장소</option>
            <option value="world">설정·세계관</option>
            <option value="item">사물·용어</option>
            <option value="plot">플롯·복선</option>
            <option value="memo">메모</option>
            <optgroup label="본문 주석">
              <option value="anno">주석 전체</option>
              <option value="index">색인</option>
              <option value="fix">교정 제안</option>
              <option value="cite">인용</option>
              <option value="intent">의도</option>
            </optgroup>
          </select>
          <button class="small" data-act="addNote">+ 새 자료</button>
        </div>
        <input id="noteSearch" class="search" placeholder="자료 검색">
        <div class="note-tools"><button class="small" data-act="index">찾아보기 (색인)</button><button class="small" data-act="annotate">+ 주석 달기</button></div>
        <ul id="noteList" class="note-list"></ul>
      </section>
      <section class="tab" id="tab-history" hidden>
        <div class="tab-head"><span>이 장의 버전 기록</span><button class="small" data-act="snapshot">+ 지금 저장</button></div>
        <p class="hint">손을 멈추면 5초 뒤 저장되고, 몇 분마다 버전이 자동으로 쌓입니다. 버전마다 바로 앞 버전에서 바뀐 곳을 정리해 보여 줘요. 누르면 비교하거나 되돌릴 수 있어요.</p>
        <div class="hist-filter" role="group" aria-label="날짜로 골라 보기">
          <select id="hfYear" aria-label="연도"><option value="">모든 해</option></select>
          <select id="hfMonth" aria-label="월"><option value="">모든 달</option></select>
          <select id="hfDay" aria-label="일"><option value="">모든 날</option></select>
        </div>
        <button class="small hist-sum-btn" id="histSummary" hidden>고른 기간에 바뀐 내용 정리</button>
        <div id="historyList" class="history-list"></div>
      </section>
    </aside>

    <!-- 가운데: 편집기 -->
    <main class="workspace" id="workspace">
      <div class="paper-scroll" id="paperScroll">
        <div class="paper" id="paper">
          <div id="editorHost"></div>
        </div>
      </div>

      <!-- 퇴고 모드 -->
      <div class="revision" id="revision" hidden>
        <div class="rev-bar">
          <div class="rev-group">
            <label>비교 기준</label>
            <select id="revBase"></select>
          </div>
          <div class="rev-group">
            <label class="switch"><input type="checkbox" id="revMarks" checked><span></span> 바뀐 곳 표시</label>
            <label class="switch"><input type="checkbox" id="revSync" checked><span></span> 함께 스크롤</label>
          </div>
          <div class="rev-group rev-stats" id="revStats"></div>
          <button class="small" id="revChanges">변경 목록</button>
          <button class="small" data-act="revision">닫기</button>
        </div>
        <div class="rev-panes" id="revPanes">
          <section class="rev-pane" id="revLeft">
            <div class="pane-head">
              <span class="pane-title" id="revLeftTitle">이전</span>
              <div class="seg"><button data-left="page" class="on">페이지</button><button data-left="flow">본문</button></div>
              <button class="small" id="revRestore" title="이 버전으로 되돌리기">이 버전으로 되돌리기</button>
            </div>
            <div class="pane-body" id="revLeftBody"></div>
          </section>
          <section class="rev-pane" id="revRight">
            <div class="pane-head">
              <span class="pane-title">지금 원고</span>
              <div class="seg"><button data-right="page">페이지</button><button data-right="edit" class="on">편집</button></div>
            </div>
            <div class="pane-body" id="revRightBody"></div>
          </section>
          <aside class="rev-changes" id="revChangeList" hidden></aside>
        </div>
      </div>

      <!-- 전체 이어 보기 -->
      <div class="cork book" id="bookView" hidden>
        <div class="rev-bar"><strong>전체 이어 보기</strong><span class="hint" id="bookStat"></span>
          <div class="seg"><button data-book="flow" class="on">글만</button><button data-book="page">쪽 모양</button></div>
          <label class="switch"><input type="checkbox" id="bookNoCh"><span></span>장 구분 없이</label>
          <label class="switch" id="bookChPageWrap" hidden><input type="checkbox" id="bookChPage" checked><span></span>장마다 새 쪽</label>
          <select id="bookToc" class="small" aria-label="차례"></select>
          <button class="small" data-act="book">닫기</button></div>
        <div class="book-body" id="bookBody"></div>
      </div>

      <!-- 코르크보드 -->
      <div class="cork" id="cork" hidden>
        <div class="rev-bar"><strong>코르크보드</strong><span class="hint">카드를 끌어 장 순서를 바꿀 수 있어요</span><button class="small" data-act="cork">닫기</button></div>
        <div class="cork-grid" id="corkGrid"></div>
      </div>
    </main>
  </div>

  <!-- 아래 상태 줄 -->
  <footer class="statusbar">
    <span id="stChars" title="공백 포함 / 공백 제외"></span>
    <span id="stManu" title="200자 원고지 기준"></span>
    <span id="stTotal" title="작품 전체"></span>
    <span id="stSel" class="st-sel" hidden></span>
    <span id="pvZoom" hidden><span id="pvStat" title="이 장의 쪽 수"></span> <select class="pvzoom" id="pvZoomSel" title="쪽 보기 배율"><option value="fit">폭 맞춤</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option></select></span>
    <button class="st-proof" id="stProof" hidden></button>
    <button class="st-proof st-tidy" id="stTidy" hidden title="원고 다듬기 규칙에 걸리는 곳 · 눌러서 다듬기 창"></button>
    <button class="today" id="stToday" data-act="today" title="오늘 쓴 양: 붙여넣기 뺀 양·포함한 양, 초기화"></button>
    <span class="goal" id="stGoal" data-act="goals" title="오늘 목표"><span class="bar"><i id="goalBar"></i></span><span id="goalText"></span></span>
    <span id="stSprint" hidden></span>
  </footer>

  <!-- 찾기/바꾸기 -->
  <div class="findbar" id="findbar" hidden>
    <input id="findInput" placeholder="찾을 말">
    <input id="replaceInput" placeholder="바꿀 말">
    <span id="findCount"></span>
    <button data-find="prev" title="이전">↑</button>
    <button data-find="next" title="다음">↓</button>
    <button data-find="one">바꾸기</button>
    <button data-find="all">모두 바꾸기</button>
    <label><input type="checkbox" id="findAllChapters"> 모든 장</label>
    <button data-find="close">✕</button>
  </div>
</div>

<!-- 대화 상자 -->
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileInput" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
